name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install SDK platform 37 and build-tools 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: Verify APK signature is stable
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED="485f0e1dde1065734ca508caf35cd0f29f2daacf620c28e7246bc9db4220d0a7"
          FAIL=0
          for APK in out/*.apk; do
            "$APKSIGNER" verify --print-certs "$APK" > /tmp/sig.txt 2>&1 || true
            if grep -qi "$EXPECTED" /tmp/sig.txt; then
              echo "签名一致: $(basename "$APK")"
            else
              echo "签名不一致: $(basename "$APK")"; FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yike-apk
          path: out/*.apk
          retention-days: 30

      # 每次构建覆盖同一个 ci 标签下的 APK，方便用加速链接直接下载，不会堆版本
      - name: Publish rolling apk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci > /dev/null 2>&1 || gh release create ci --prerelease --title "自动构建" --notes "main 分支每次构建都会覆盖这个包，不是正式版本。"
          cp out/*.apk out/yike-debug.apk || true
          gh release upload ci out/yike-debug.apk --clobber
